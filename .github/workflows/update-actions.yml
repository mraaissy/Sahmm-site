name: Actualiser les fiches Actions (quotidien)

on:
  # Planification automatique désactivée : les données sont figées.
  # Pour relancer manuellement une actualisation, allez dans l'onglet
  # "Actions" du dépôt GitHub → ce workflow → bouton "Run workflow".
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Récupérer les fiches Actions (casablancabourse.com)
        run: python scripts/update_actions.py

      - name: Committer et pousser si changement
        run: |
          git config user.name "sahm-bot"
          git config user.email "bot@sahmm.ma"
          git add public/data/actions.json
          git diff --staged --quiet || git commit -m "Actualisation quotidienne des fiches Actions"
          git push
